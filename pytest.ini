[pytest]
# Test discovery and async handling for the Python suite.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    integration: tests that require a real Docker daemon and/or Redis (deselect with -m "not integration")
    security: container-escape attempt tests (require real Docker)
filterwarnings =
    ignore::DeprecationWarning
