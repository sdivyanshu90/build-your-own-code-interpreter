name: CI

# Lint, type-check, unit-test, build images, and run integration tests on every PR and push to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: code-sandbox

jobs:
  lint-api:
    name: Lint & type-check (API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: code-sandbox/api/package-lock.json
      - run: npm install --no-audit --no-fund
        working-directory: code-sandbox/api
      - run: npm run lint
        working-directory: code-sandbox/api
      - run: npm run typecheck
        working-directory: code-sandbox/api

  lint-worker:
    name: Lint & type-check (worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r worker/requirements.txt -r tests/requirements.txt
      - run: ruff check worker tests
      - run: ruff format --check worker tests
      - run: mypy worker

  test-api:
    name: Unit tests (API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: code-sandbox/api/package-lock.json
      - run: npm install --no-audit --no-fund
        working-directory: code-sandbox/api
      - name: Vitest with coverage gate (>=90% line / >=85% branch)
        run: npm run test:coverage
        working-directory: code-sandbox/api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: code-sandbox/api/coverage/

  test-worker:
    name: Unit tests (worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r worker/requirements.txt -r tests/requirements.txt
      - name: Pytest with coverage gate (>=90% on the sandbox core)
        run: |
          python -m pytest tests/unit -m "not integration" \
            --cov=worker.sandbox --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-coverage
          path: code-sandbox/coverage.xml

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint-api, lint-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API and worker images
        run: make build-services
      - name: Build all runtime images
        run: make build-runtimes

  integration:
    name: Integration tests (real Docker + Redis)
    runs-on: ubuntu-latest
    needs: [build-images]
    services:
      redis:
        image: redis:7.4.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r worker/requirements.txt -r tests/requirements.txt
      - name: Build runtime images for the executor tests
        run: make build-runtimes
      - name: Run integration + security suites
        run: python -m pytest tests/integration tests/security -m integration -v
