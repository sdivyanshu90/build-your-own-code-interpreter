name: Release

# On a version tag (v*): build + push all images, run e2e against the freshly-built stack, and
# publish a GitHub release with an auto-generated changelog.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

defaults:
  run:
    working-directory: code-sandbox

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive the version tag
        id: ver
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Build & push runtime images
        run: make push-runtimes REGISTRY=${{ env.IMAGE_PREFIX }} TAG=${{ steps.ver.outputs.tag }}
      - name: Build & push API + worker images
        run: make push-services REGISTRY=${{ env.IMAGE_PREFIX }} TAG=${{ steps.ver.outputs.tag }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the pushed service images (keyless / OIDC)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes ${{ env.IMAGE_PREFIX }}/code-sandbox-api:${{ steps.ver.outputs.tag }}
          cosign sign --yes ${{ env.IMAGE_PREFIX }}/code-sandbox-worker:${{ steps.ver.outputs.tag }}

  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
        working-directory: code-sandbox/api
      - name: Bring up the full stack
        run: |
          cp .env.example .env
          echo "ALLOW_ANONYMOUS=true" >> .env
          make build-runtimes
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/v1/health && break || sleep 2;
          done
      - name: Run the e2e suite
        run: npx vitest run --config ../tests/e2e/vitest.e2e.config.ts
        working-directory: code-sandbox/api
        env:
          API_BASE_URL: http://localhost:8080
      - name: Tear down
        if: always()
        run: docker compose down -v

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [e2e]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          echo "## Changes" > CHANGELOG_RELEASE.md
          if [ -n "$PREV" ]; then
            git log --pretty='- %s (%h)' "${PREV}..${GITHUB_REF_NAME}" >> CHANGELOG_RELEASE.md
          else
            git log --pretty='- %s (%h)' >> CHANGELOG_RELEASE.md
          fi
        working-directory: .
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG_RELEASE.md
          generate_release_notes: true
          fail_on_unmatched_files: false
