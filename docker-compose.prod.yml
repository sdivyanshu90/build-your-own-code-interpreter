# Production overrides. Apply with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from dev: no source rebuilds (pinned, pre-pushed images), no published
# Redis/MinIO ports (internal only), anonymous access OFF, strict CORS, real secrets injected
# from the environment / secret manager, and resource limits on every service.
name: code-sandbox

services:
  redis:
    ports: []
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-1gb}"
      - "--maxmemory-policy"
      - "noeviction"
    deploy:
      resources:
        limits:
          memory: 1280m

  minio:
    ports:
      - "9001:9001"
    deploy:
      resources:
        limits:
          memory: 1g

  api:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/code-sandbox-api:${IMAGE_TAG:?set IMAGE_TAG}
    build: !reset null
    environment:
      NODE_ENV: production
      ALLOW_ANONYMOUS: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required in production}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits:
          cpus: "1"
          memory: 512m
    restart: always

  worker:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/code-sandbox-worker:${IMAGE_TAG:?set IMAGE_TAG}
    build: !reset null
    environment:
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
      # Pin runtime images by digest in production (see image_registry.py).
      SANDBOX_DIGEST_PYTHON: ${SANDBOX_DIGEST_PYTHON:-}
      SANDBOX_DIGEST_JAVASCRIPT: ${SANDBOX_DIGEST_JAVASCRIPT:-}
      SANDBOX_DIGEST_BASH: ${SANDBOX_DIGEST_BASH:-}
    deploy:
      replicas: ${WORKER_REPLICAS:-4}
      resources:
        limits:
          cpus: "4"
          memory: 4g
    restart: always

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    restart: always
